<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPEC-13 corrupted yield sign / yield sign motif -->
  <rect width="128" height="128" fill="#0a0a0a"/>
  <!-- Triangle -->
  <polygon points="64,8 120,110 8,110" fill="none" stroke="#ffffff" stroke-width="6"/>
  <!-- Polka dots on two silhouettes -->
  <circle cx="44" cy="72" r="18" fill="#1a1a1a" stroke="#fff" stroke-width="2"/>
  <circle cx="84" cy="72" r="18" fill="#1a1a1a" stroke="#fff" stroke-width="2"/>
  <circle cx="40" cy="68" r="3" fill="#fff"/>
  <circle cx="48" cy="76" r="2" fill="#fff"/>
  <circle cx="44" cy="62" r="2" fill="#fff"/>
  <circle cx="80" cy="68" r="3" fill="#fff"/>
  <circle cx="88" cy="76" r="2" fill="#fff"/>
  <circle cx="84" cy="62" r="2" fill="#fff"/>
  <!-- Noses -->
  <line x1="44" y1="72" x2="56" y2="69" stroke="#c8a070" stroke-width="2.5"/>
  <line x1="84" y1="72" x2="72" y2="69" stroke="#c8a070" stroke-width="2.5"/>
  <!-- Stars -->
  <circle cx="20" cy="20" r="1.5" fill="#fff"/>
  <circle cx="108" cy="15" r="1" fill="#fff"/>
  <circle cx="10" cy="50" r="1" fill="#fff"/>
  <circle cx="115" cy="45" r="1.5" fill="#fff"/>
